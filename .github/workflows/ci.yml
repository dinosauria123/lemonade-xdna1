name: CI (software-only)

# This repo is fundamentally about NPU bring-up: driving the AMD XDNA1
# "Phoenix"/"Hawk Point" NPU with the IRON/mlir-aie + Peano toolchain and
# hand-authored AIE ISA kernels. None of that is runnable on a normal
# GitHub-hosted runner - there is no NPU, no matched staging amdxdna.ko,
# and no IRON/mlir-aie/Peano toolchain installed here. This workflow does
# NOT and CANNOT verify:
#   - any examples/npu_*.py actually running (all but npu_powerlog.py
#     import aie.iron, which requires the IRON toolchain + a real NPU)
#   - the examples/kernels/*.cc AIE vector kernels compiling (they need
#     the Peano AIE2 cross-compiler and aie_api headers)
#   - scripts/*.sh actually bringing up a driver/firmware (root + real
#     hardware + a matched kernel)
#   - any of the numbers in BENCHMARKS.md / RESULTS.md
#
# What IS hardware-independent and checked here:
#   - every Python file parses (byte-compiles) cleanly
#   - the shell setup/bringup scripts pass shellcheck (warning+ severity;
#     the two SC2015 info-level "A && B || C" notes in setup_iron.sh /
#     install_firmware.sh are intentional best-effort steps, not bugs)
#   - examples/npu_powerlog.py's parsing/math (parse_dpm, delta_uj, the
#     no-hardware-present degrade path) is pure stdlib and is exercised
#     by tests/test_npu_powerlog.py without root or an NPU

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile all Python sources (syntax only, no aie/NPU imports needed)
        run: python -m compileall -q examples tests

      - name: ShellCheck bring-up scripts (warning+ severity)
        run: shellcheck -S warning scripts/*.sh

      - name: npu_powerlog.py pure-function self-test (no root, no NPU)
        run: python3 tests/test_npu_powerlog.py
